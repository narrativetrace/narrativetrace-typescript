    registry: npm
    coordinate: "@narrativetrace/core"
    page: "README.md#packages"
    claim: "@narrativetrace/core resolves on the npm registry at the installed version"
    since: "0.1.0"
    documented_default: "PRESENT"
    probe: "contract-probe/probes/entry-point.mjs"

