# Secrets-scanner config (security-tooling pass, 2026-09-02). Extends
# gitleaks' own default ruleset rather than hand-rolling detection patterns —
# consistent with the semgrep config using OSS community rulesets only, no
# custom rules.
#
# Allowlist entries are accepted-risk records, each scoped and reasoned —
# never a place to pre-guess noise that doesn't exist yet.
[extend]
useDefault = true

# First real false positive, 2026-09-06 (caught by the pre-release scan the
# dotnet v0.1.0 publish run prompted — the fixture landed with the redaction
# mirror wave, after the clean 2026-09-02 full-history sweep): the redaction
# test suite proves that JWT-shaped values are redacted, which is only
# provable with a string that genuinely matches the JWT shape — a synthetic,
# unsigned vector, valuable to nobody. Scoped to the jwt rule, in every file
# that carries this same synthetic fixture for the same reason (2026-09-10:
# the nestjs auto-wrap monotonicity test reuses the identical vector to prove
# the value-shape axis still redacts there too; the value-shape-flag fix's own
# focused unit/integration tests — value-renderer.test.ts's renderCapture
# suite and parameter-name-redaction.test.ts's new describe block — reuse it
# a third and fourth time to prove the captured `redacted` flag, not just the
# rendered text, flips on the same vector; 2026-09-14: ADV-2026-09-14-1's
# regression coverage in redacted-value-containment.test.ts reuses it a fifth
# time to prove a Map key is scanned for the JWT shape too, not just a value).
[[allowlists]]
description = "synthetic JWT fixture in redaction tests exists to prove JWT redaction"
targetRules = ["jwt"]
paths = [
  '''packages/core/__tests__/redaction-policy\.test\.ts''',
  '''packages/core/__tests__/value-renderer\.test\.ts''',
  '''packages/core/__tests__/redacted-value-containment\.test\.ts''',
  '''packages/nestjs/__tests__/parameter-redaction\.test\.ts''',
  '''packages/proxy/__tests__/parameter-name-redaction\.test\.ts''',
]

# Second false positive, 2026-10-08 (Phase 5 milestone 2): the value-free gate's own vocabulary test
# proves that credential-PREFIX shapes are refused before a report can be filed, which is only
# provable with strings that genuinely carry those prefixes. All four are the synthetic vectors the
# shared cross-runtime corpus already carries verbatim
# (`packages/security-tests/hostile-corpus/feedback.json`, rows `value-shape-github-token`,
# `value-shape-github-fine-grained-token`, `value-shape-sk-prefixed-api-key`,
# `value-shape-aws-access-key-id`) — documented, valueless, and authenticating nothing. The corpus
# file itself does not trip this rule because JSON's quoting is not the `key = "value"` assignment
# shape `generic-api-key` looks for; the TypeScript table form is. Scoped to that one rule and that
# one file, rather than concatenating the fixtures out of parts: a fixture spelled in halves to
# dodge a scanner is a fixture the next reader reassembles, and this test's whole subject is what
# those bytes look like.
[[allowlists]]
description = "synthetic credential-prefix fixtures in the value-free vocabulary test exist to prove those prefixes are refused"
targetRules = ["generic-api-key"]
paths = ['''packages/tooling/__tests__/feedback/secret-vocabulary\.test\.ts''']
