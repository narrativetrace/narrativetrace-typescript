# Trigger cases (skill-harness-design.md §4.3): must fire on the positive phrasings, must stay
# quiet on the negative ones. Gates on rate, target >=90% (harness §5). Phrasings mined from the
# README's Quick Start, llms.txt's "Install and first trace", and the troubleshooting page's own
# framing of what a not-yet-installed project looks like — never invented, per skill-design.md §2.1
# Channel 1.

positive:
  - "add narrative tracing to my service"
  - "install narrativetrace"
  - "get a trace in 60 seconds"
  - "wrap this class so I can see a trace"
  - "send my traces to my logger"
  - "set up narrativetrace in this project"
  - "how do I get started with narrativetrace"
  - "this project has no narrativetrace yet, help me add it"
  - "hook narrativetrace up to pino"
  - "trace this service and show me the output"
  # The PUBLISHED init prompt itself (README "Start here", the three README mirrors,
  # documentation/llms.txt — pinned byte-identical by init-prompt-drift.test.ts). A skill that
  # does not fire on the text we tell people to paste hands the agent to nobody.
  - |
    Set up NarrativeTrace in this project and show me its first trace.
    1. Read https://narrativetrace.ai/typescript/llms.txt first. It carries the install block and the
    known traps. Do not guess versions or artifact names.
    2. If this directory has no project yet, create the smallest console app that
    llms.txt's "Install and first trace" block describes. Otherwise work inside the existing
    project and trace one real service boundary.
    3. Add `@narrativetrace/cli` as a dev dependency the way llms.txt shows, then run
    `npx @narrativetrace/cli init --dry-run` and show me the diff. It installs the
    NarrativeTrace agent skills into this project and adds a marked section to AGENTS.md. Run
    it for real only after I have seen the diff.
    4. If the `add-narrative-tracing` skill is now available, follow it. Otherwise follow the
    "Install and first trace (copy this)" block in llms.txt.
    5. Add one test that traces a call with a deny-listed parameter and asserts the trace
    shows `[REDACTED]` for it.
    6. Run the program, then run the doctor (`npx @narrativetrace/cli doctor`). Paste
    the trace and the doctor report, explain the trace in two sentences, and list exactly what
    changed in the project.
    Rules: never disable redaction; do not commit `.received.nt` files; pass
    parameter names to `traceObject` explicitly so arguments never render as `arg0`; run
    everything in the foreground and read the output before you report; if you cannot fetch
    URLs, say so and I will paste llms.txt.

# The doctor's own positive set (diagnosing an existing install is that skill's job, not this
# one's), plus another skill's job or no skill's job at all. Must NOT fire.
negative:
  - "check my narrativetrace setup"
  - "is narrativetrace broken"
  - "why isn't anything being traced"
  - "my traces aren't showing up"
  - "parameters show as arg0, arg1"
  - "no trace files are written"
  - "narrativetrace doctor"
  - "make my tests produce narrative traces"
  - "rename these unclear method names"
  - "generate a sequence diagram for this PR"
  - "summarize hotspots across my captured traces"
  - "upgrade narrativetrace to the latest version"
