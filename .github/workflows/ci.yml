# Continuous integration — builds, lints and tests the package on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # gate.sh is the same chain as `pnpm run check`, step by step, with
      # coverage at a concurrency a loaded runner survives — turbo's default
      # flakes the core stress suite for non-regression reasons.
      - run: bash scripts/gate.sh
