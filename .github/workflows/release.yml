# Release workflow — publishes the package when a version tag is pushed, gated
# by a protected environment so credentials are exposed only after approval.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # npm provenance (Sigstore) — no signing secret needed
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: corepack enable

      - name: Assert tag matches the package version
        run: |
          version="$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' packages/core/package.json | head -1)"
          [ "v$version" = "${GITHUB_REF_NAME}" ] || {
            echo "tag ${GITHUB_REF_NAME} does not match package version $version"; exit 1; }
          case "$version" in *-SNAPSHOT*|*-dev*|0.0.0) echo "refusing to release $version"; exit 1 ;; esac

      - run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm run check

      - name: Publish packages to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          pnpm -r publish --no-git-checks --provenance
