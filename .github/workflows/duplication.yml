# Duplication report — the nightly JSON producer for a cross-repo duplication resolver (a separate
# piece of work on its own branch, not this file's job). `pnpm run duplication:check` already runs
# the same report and ratchets it every commit (see documentation/duplication.md); this workflow
# exists only to hand the resulting `duplication.json` to something outside this checkout on a
# predictable schedule, as a build artifact rather than a committed file (`reports/*` is
# git-ignored here, same as this repo's other generated reports).
name: Duplication

permissions: {}

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: corepack enable
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm run duplication:report
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: duplication-report
          path: reports/duplication/duplication.json
          retention-days: 30
