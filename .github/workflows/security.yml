# Security scanning — secret detection and static analysis on pull requests; the full set,
# including dependency vulnerability scanning, on a schedule and on manual dispatch.
name: Security

on:
  pull_request:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  # Each tool is REQUIRED here, not merely attempted — bare $CI is not enough on its own (see the
  # scripts' own comments): NARRATIVETRACE_REQUIRE_<TOOL> turns a failed install/bootstrap into a
  # failing job instead of a silent skip.
  secrets:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      NARRATIVETRACE_REQUIRE_GITLEAKS: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - run: sh scripts/gitleaks.sh full

  semgrep:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      NARRATIVETRACE_REQUIRE_SEMGREP: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: sh scripts/semgrep-scan.sh

  osv-scan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      NARRATIVETRACE_REQUIRE_OSV_SCANNER: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: sh scripts/osv-scan.sh

  dependency-audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run security:audit
