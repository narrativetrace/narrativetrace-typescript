# npm artifact publication — owner-triggered, never automatic.
#
# Fires on the annotated v<version> tag a release pushes to this repo; the `release` environment
# (required reviewer, v*-tag deployment rule) gates the job, so
# credentials are exposed only after a human approves this exact run. `workflow_dispatch` exists
# only to re-run a tag that already exists — dispatched on the tag ref itself (pick the tag, not
# main, in the Actions "Run workflow" UI) — never a way to publish ahead of a tag: the version
# assertion below fails loudly if the checked-out ref is not v<version>.
#
# Auth is npm trusted publishing (OIDC): each @narrativetrace package's
# settings on npmjs.com name this repository, this workflow file, and the
# `release` environment as its trusted publisher, and the run mints a
# short-lived token per publish. No long-lived npm token exists anywhere
# once bootstrap is done.
#
# The upload runs through the npm CLI, not pnpm: OIDC trusted publishing is
# implemented only in npm >= 11.5.1 (pnpm's support is an open request,
# pnpm/pnpm#9812) — the 0.1.1 release's first steady-state run proved this
# the hard way (pnpm publish -> ENEEDAUTH once the bootstrap token was
# gone). pnpm still packs each tarball, because only pnpm rewrites
# workspace:* dependency ranges to real versions at pack time.
#
# (Historical: each package's very first publish ran with a granular,
# same-day-revoked NPM_TOKEN, since trusted publishing configures on an
# existing package. That token and secret are gone; no token mode remains.)
#
# Provenance: publishConfig.provenance is set in every publishable manifest,
# because `pnpm -r publish --provenance` silently drops the flag in recursive
# mode (empirically proven, test-pinned in package-metadata.test.ts). Do not
# "simplify" back to the flag.
name: Publish

permissions: {}

on:
  push:
    tags: ["v*"]
  # Re-run only (see header comment above): the run must be dispatched on the tag ref, never on
  # main — the version-tag assertion enforces this by failing whenever GITHUB_REF_NAME isn't
  # v<version> for the version packages/core/package.json declares, dispatch or push alike.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    # The environment gates the run behind the repository's protection rules
    # and is part of each package's trusted-publisher identity — renaming it
    # breaks every configured policy at once.
    environment: release
    permissions:
      contents: read
      # OIDC token minting for trusted publishing and provenance attestation.
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Ask the build what it is about to publish, rather than trusting the tag alone. The
      # version of record is packages/core/package.json; every other public package must agree
      # with it — a mismatch here would otherwise publish inconsistent versions under one tag.
      - name: Resolve the version being released
        id: version
        run: |
          set -euo pipefail
          version="$(node -e "console.log(require('./packages/core/package.json').version)")"
          [ -n "$version" ] || { echo "could not determine the project version"; exit 1; }
          mismatched=""
          for pkg in packages/*/package.json; do
            priv="$(node -e "console.log(!!require('./$pkg').private)")"
            [ "$priv" = "true" ] && continue
            v="$(node -e "console.log(require('./$pkg').version)")"
            [ "$v" = "$version" ] || mismatched="$mismatched $pkg($v)"
          done
          [ -z "$mismatched" ] || {
            echo "public package versions disagree with packages/core ($version):$mismatched"; exit 1; }
          echo "value=$version" >> "$GITHUB_OUTPUT"

      # The actual gate: whatever ref this run checked out — tag push or manual dispatch — must
      # be exactly v<version>. A dispatch from main fails here the same as a mistagged push would.
      - name: Assert tag matches the release version
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          [ -n "${VERSION}" ] || { echo "empty version reached the tag check"; exit 1; }
          [ "v${VERSION}" = "${GITHUB_REF_NAME}" ] || {
            echo "ref ${GITHUB_REF_NAME} does not match release version ${VERSION} (expected tag v${VERSION})"
            exit 1
          }
          case "${VERSION}" in
            *-SNAPSHOT*|*-dev*|0.0.0) echo "refusing to release ${VERSION}"; exit 1 ;;
          esac

      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # Full gate before anything leaves the runner: artifacts publish only
      # from a tree that passes the same checks CI enforces.
      - run: bash scripts/gate.sh
      # npm >= 11.5.1 is the OIDC floor; the runner's bundled npm is older.
      # Pinned exactly — bump deliberately, never @latest in a release job.
      - run: npm install -g npm@11.5.1
      - name: Publish all public packages (pnpm pack, npm OIDC publish)
        run: |
          set -euo pipefail
          mkdir -p /tmp/nt-tarballs
          for dir in packages/*/; do
            name="$(node -e "const m=require('./$dir/package.json'); if(!m.private) console.log(m.name)")"
            [ -n "$name" ] || continue
            echo ">> packing $name"
            (cd "$dir" && pnpm pack --out "/tmp/nt-tarballs/%s-%v.tgz" >/dev/null)
          done
          fail=0
          for t in /tmp/nt-tarballs/*.tgz; do
            echo ">> publishing $t"
            if out="$(npm publish "$t" --access public --provenance 2>&1)"; then
              echo "$out" | tail -2
            elif echo "$out" | grep -qE "cannot publish over|EPUBLISHCONFLICT|previously published"; then
              echo ">>   already published — skipping (safe re-run)"
            else
              echo "$out" | tail -15
              fail=1
            fi
          done
          exit "$fail"
