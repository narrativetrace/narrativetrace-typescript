# OpenSSF Scorecard — supply-chain security posture, scored weekly and on every push to main.
# Results publish to the OpenSSF Scorecard API (visible on the repo's badge, once added) and
# upload as SARIF to the repo's code-scanning alerts. See documentation/security-posture.md.
name: Scorecard

permissions: {}

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 5 * * 2"

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: results.sarif
