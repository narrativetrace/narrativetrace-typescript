# Duplication baseline (jscpd, 60-token floor, identifiers/literals ignored via
# --ignore-identifiers --ignore-literals) — main sources only (packages/*/src); the test tree
# (packages/*/__tests__ + examples/** + tools/__tests__/**) is reported by
# `tools/duplication-report.ts` but never gates (see documentation/duplication.md).
# `tools/duplication-check.ts` fails when the measured main percentage rises more than 0.3 points
# above `main.percent`, or when a non-exempt cluster is larger than `main.largestCluster` — see
# config/duplication/exemptions.txt for what is exempt and why.
#
# Recorded from the first scan, floored to measured (the same idiom this repo already uses for
# coverage and mutation-score floors): lower this with the commit that removes the duplication,
# never raise it without a reasoned exemption line instead.
# main.percent still counts exempt data-table rows (the clarity dictionaries, TraceNamer,
# generic-token-detector.ts, attribute-tier.ts and scaffolding-bundle.ts word/data tables, and the
# SpanContext/CanonicalEntry wide-record builders — all exempted by path in exemptions.txt, none
# excluded from the percentage itself).
# main.largestCluster is the largest NON-exempt cluster after the 2026-09-12 exemption wave
# (redaction-policy.ts's own word-list-shaped deny-list vocabulary coincidentally matching
# trace-namer.ts's naming tables' shape, 519 tokens — deliberately left unexempted; see
# exemptions.txt's trace-namer.ts entry for why). Lowered from the first scan's 1559 tokens
# (trace-namer.ts matching itself — the same file the Java canonical repo's own first scan flagged as
# its largest finding, TraceNamer.java, a cross-port match) once its word tables were exempted.
# main.percent lowered 2026-09-13 (15.3 -> 14.8, measured 15.5 immediately before the commit that
# lowered it): the sequence-diagram mirror ruling factored mermaid-sequence.ts/plantuml-sequence.ts's
# near-identical traversal into one shared sequence-walk.ts + a SequenceGrammar per format, cutting
# the pair's whole-file duplicate cluster down to two small residual clusters (the two renderers'
